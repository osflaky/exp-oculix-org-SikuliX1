name: Build and Release

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 2.0.5-final
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install API to local repo
      run: mvn -B -pl API install -DskipTests | egrep -v 
        "^\[INFO\].*?Download.*?http"
    - name: Build API fat JAR (Windows)
      run: mvn -B -pl API -P complete-win-jar package -DskipTests | egrep -v 
        "^\[INFO\].*?Download.*?http"
    - name: Build IDE fat JAR (Windows)
      run: mvn -B -pl IDE -P complete-win-jar package -DskipTests | egrep -v 
        "^\[INFO\].*?Download.*?http"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-jars
        path: |
          API/target/*complete-win*.jar
          IDE/target/*complete-win*.jar

    name: build-windows [ubuntu-latest--x64]
    timeout-minutes: 150
